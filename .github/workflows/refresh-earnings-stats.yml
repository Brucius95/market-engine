name: Refresh Earnings Stats

on:
  schedule:
    - cron: '30 6 * * 1'   # ogni lunedì 6:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Ricalcola le reazioni storiche ai conti
        run: python earnings_monitor.py
      - name: Salva i risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earnings_historical_cases.json
          git diff --quiet --cached || git commit -m "aggiornamento statistiche conti"
          for t in 1 2 3; do git push && break; git pull --rebase origin main; done
