name: Refresh Historical Stats

on:
  schedule:
    - cron: '0 6 * * 1'   # ogni lunedì alle 6:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # necessario per poter fare il commit del file aggiornato

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le librerie necessarie
        run: pip install -r requirements.txt

      - name: Ricalcola le statistiche storiche reali
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python compute_historical_stats.py

      - name: Salva il file aggiornato nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historical_cases.json
          git diff --quiet --cached || git commit -m "aggiornamento automatico statistiche storiche"
          git push
